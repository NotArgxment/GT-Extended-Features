site_name: GTM Extended Features
site_description: Addon for GTCEu Modern 1.20.1 providing quality-of-life changes and small tools for modpack developers
site_url: https://NotArgxment.github.io/GT-Extended-Features/
repo_url: https://github.com/NotArgxment/GT-Extended-Features
repo_name: NotArgxment/GT-Extended-Features
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Overview: content/features.md
  - Versions:
      - 4.0.0: content/Versions/4.0.0.md
      - 3.0.0: content/Versions/3.0.0.md
      - 2.4.0: content/Versions/2.4.0.md
      - 2.3.0: content/Versions/2.3.0.md
      - 2.2.0: content/Versions/2.2.0.md
      - 2.1.0: content/Versions/2.1.0.md
      - 2.0.1: content/Versions/2.0.1.md
      - 2.0.0: content/Versions/2.0.0.md
  - Examples:
      - Modifiers: content/Miscellaneous/modifiers.md
      - KubeJS Examples: content/Miscellaneous/recipes.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NotArgxment/GT-Extended-Features