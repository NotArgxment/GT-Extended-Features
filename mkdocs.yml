site_name: GTM Extended Features
site_description: Addon for GTCEu Modern 1.20.1 providing quality-of-life changes and small tools for modpack developers
site_url: https://NotArgxment.github.io/GT-Extended-Features/
repo_url: https://github.com/NotArgxment/GT-Extended-Features
repo_name: NotArgxment/GT-Extended-Features
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Main:
    - Overview: main.md
    - Addon Features: features.md
  - Integration: integration.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NotArgxment/GT-Extended-Features