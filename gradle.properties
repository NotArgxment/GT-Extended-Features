# Gradle Arguments.
    # Increases memory
    org.gradle.jvmargs = -Xmx2G
    # Hides "Deprecated Gradle features were used..." and "--warning-mode"
    org.gradle.warning.mode = none
    # Disables "Problems report"
    org.gradle.problems.report = false

# Base properties
    minecraft_version = 1.20.1
    forge_version     = 47.4.10
    mapping_channel   = parchment
    mapping_version   = 2023.09.03

# Mod Properties
    mod_version        = 3.0.0
    maven_group        = com.argxment
    archives_base_name = extendedfeatures
    mod_id             = extendedfeatures
    mod_name           = GT Extended Features
    mod_url            = https://github.com/NotArgxment/GT-Extended-Features
    mod_author         = Argxment
    mod_license        = LGPLv3.0

# Dependencies
    gtceu_version         = 7.5.3
    ldlib_version         = 1.0.50
    registrate_version    = MC1.20-1.3.11
    configuration_version = 2.2.0
    jade_version          = 11.13.2